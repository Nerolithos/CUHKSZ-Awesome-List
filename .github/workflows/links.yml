name: Check external links
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 1 * *'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --timeout 30 --exclude '^https://img.shields.io' --exclude '^https://awesome.re' README.md README.zh-CN.md docs/*.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
